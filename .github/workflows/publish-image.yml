# Builds the self-host image (Dockerfile) and pushes it to ghcr.io/wolfsdk/workspace on
# workspace-v<version> tags, as <version> and latest. The version is that of @wolfsdk/workspace.
# workflow_dispatch builds the image and starts it once without pushing.
#
# The image holds this repository's open-source code only. The Wolf engine is not in it: the
# container installs it into its data volume on first start (docker-entrypoint.sh).
name: publish-image

on:
  push:
    tags:
      - "workspace-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/wolfsdk/workspace

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the version and check that the tag names it
        id: version
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("packages/workspace-cli/package.json", "rb"))["version"])')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "workspace-v$version" ]; then
            echo "publish-image: tag $GITHUB_REF_NAME does not name version $version" >&2
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Build the image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.source=https://github.com/wolfsdk/workspace" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" .
      - name: Start the image once and wait for it to answer
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          docker run --detach --name smoke --publish 127.0.0.1:8787:8787 "$IMAGE:$VERSION"
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/api/health; then
              docker rm --force smoke
              exit 0
            fi
            sleep 2
          done
          docker logs smoke >&2
          exit 1
      - name: Push the image
        if: startsWith(github.ref, 'refs/tags/workspace-v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
          docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION" >>"$GITHUB_STEP_SUMMARY"
