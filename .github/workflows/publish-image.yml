# Builds the self-host image (Dockerfile) for linux/amd64 and linux/arm64 and pushes it to
# ghcr.io/wolfsdk/workspace on workspace-v<version> tags, as <version> and latest. The version is
# that of @wolfsdk/workspace. A workspace-v<version>-<revision> tag rebuilds the image for the same
# package version, for a change to the Dockerfile or the entrypoint only, and pushes it as
# <version>-<revision> and latest. workflow_dispatch builds both images and starts each once
# without pushing.
#
# The image holds this repository's open-source code only. The Wolf engine is not in it: the
# container installs it into its data volume on first start (docker-entrypoint.sh), the Linux
# build for its own architecture, so neither image needs emulation.
name: publish-image

on:
  push:
    tags:
      - "workspace-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/wolfsdk/workspace

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the version and check that the tag names it
        id: version
        run: |
          set -euo pipefail
          package=$(python3 -c 'import json; print(json.load(open("packages/workspace-cli/package.json", "rb"))["version"])')
          version=$package
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#workspace-v}
            revision=${version#"$package"}
            case "$revision" in
              "" | -[1-9] | -[1-9][0-9]) ;;
              *)
                echo "publish-image: tag $GITHUB_REF_NAME names neither version $package nor a revision of it ($package-N)" >&2
                exit 1
                ;;
            esac
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

  image:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.source=https://github.com/wolfsdk/workspace" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            --tag "$IMAGE:$VERSION-$ARCH" .
          test "$(docker inspect --format '{{.Architecture}}' "$IMAGE:$VERSION-$ARCH")" = "$ARCH"
      # The entrypoint installs the engine and runs it once before it serves, so an answer here
      # also shows that the engine runs in this image. The installer's summary names the build it
      # installed, and the list of binfmt handlers shows whether the runner could have emulated
      # another architecture.
      - name: Start the image once and wait for it to answer
        run: |
          set -euo pipefail
          echo "binfmt handlers on this runner: $(ls /proc/sys/fs/binfmt_misc 2>/dev/null | tr '\n' ' ')"
          case "$ARCH" in
            arm64) engine=wolf-aarch64-unknown-linux-musl ;;
            *) engine=wolf-x86_64-unknown-linux-musl ;;
          esac
          docker run --detach --name smoke --publish 127.0.0.1:8787:8787 "$IMAGE:$VERSION-$ARCH"
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/api/health; then
              docker logs smoke 2>&1 | grep -F "Installed Wolf" | grep -F "($engine)"
              docker rm --force smoke
              exit 0
            fi
            sleep 2
          done
          docker logs smoke >&2
          exit 1
      - name: Push the image
        if: startsWith(github.ref, 'refs/tags/workspace-v')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION-$ARCH"

  manifest:
    needs: [version, image]
    if: startsWith(github.ref, 'refs/tags/workspace-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Publish one tag that names both images
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION" >>"$GITHUB_STEP_SUMMARY"
