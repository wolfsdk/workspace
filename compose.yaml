# Self-hosted Wolf Workspace: one container serving the browser UI, the API, the room WebSocket (/ws) and the
# MCP endpoint (/mcp) on port 8787, with pooled engine workers.
#
#   docker compose up -d && docker compose logs workspace
#
# The first start downloads the Wolf engine from https://wolfsdk.com into the data volume, creates one user and
# prints the address to sign in at. Rooms, document blobs, the engine and the actor table (actors.json, a map of
# bearer token to actor) live in the workspace-data volume.
#
# Without WOLF_LICENSE_KEY the engine runs under the Community Self-Host grant (1 workspace, up to 5 seats).
# Set WOLF_WORKSPACE_BIND=0.0.0.0 only behind TLS: tokens travel in the clear on plain HTTP.
# To build the image from this checkout instead of pulling it: docker compose up -d --build
services:
  workspace:
    image: ghcr.io/wolfsdk/workspace:0.1.0
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WOLF_WORKSPACE_BIND:-127.0.0.1}:8787:8787"
    environment:
      WOLF_LICENSE_KEY: "${WOLF_LICENSE_KEY:-}"
      # The licence the engine installer names on the first start.
      WOLF_INSTALL_TERMS: community-selfhost
    volumes:
      - workspace-data:/data
    restart: unless-stopped

volumes:
  workspace-data:
