# Self-hosted Wolf Workspace: one container serving the browser UI, the API, the room WebSocket (/ws) and the
# MCP endpoint (/mcp) on port 8787, with pooled engine workers.
# Without WOLF_LICENSE_KEY, runs under the Community Self-Host grant (1 workspace, up to 5 seats).
#
#   1. Write ./actors.json, a map of bearer tokens to actors:
#        {"<token>": {"kind": "user", "id": "alice", "name": "Alice"}, "<token>": {"kind": "agent", "id": "scout", "name": "Scout"}}
#   2. mkdir -p data/blobs (the container runs as uid 1000 and writes the rooms there), then docker compose up -d
#   3. Open http://127.0.0.1:8787/?token=<token>
#
# Rooms and document blobs live in ./data. Set WOLF_WORKSPACE_BIND=0.0.0.0 only behind TLS: tokens travel in the
# clear on plain HTTP.
services:
  workspace:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WOLF_WORKSPACE_BIND:-127.0.0.1}:8787:8787"
    environment:
      WOLF_LICENSE_KEY: "${WOLF_LICENSE_KEY:-}"
    volumes:
      - ./data:/data
      - ./actors.json:/etc/wolf-workspace/actors.json:ro
    restart: unless-stopped
